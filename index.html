
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITEKA KURI TWESE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ITEKA KURI TWESE</h1>
    <p>Bienvenue dans notre système de microfinance.</p>
<section id="questionsPubliques">
    <button type="button" id="btnAfficherQuestions">
        POSER DES QUESTIONS
    </button>

    <div id="zoneQuestions" style="display:none;">
        <h2>Questions fréquentes</h2>

        <div id="listeQuestions"></div>

<h2>Réponses de l'Admin</h2>
<div id="listeReponsesAdmin"></div>

        <p id="reponseFAQ"></p>

        <h2>Envoyer une question à l'Admin</h2>

        <form id="formQuestionPublique">
            <label>Nom complet :</label>
            <input type="text" id="nomQuestion" required>

            <label>Numéro de téléphone :</label>
            <input type="tel" id="telephoneQuestion" required>

            <label>Province :</label>
            <input type="text" id="provinceQuestion" required>

            <label>Commune :</label>
            <input type="text" id="communeQuestion" required>

            <label>Colline :</label>
            <input type="text" id="collineQuestion" required>

            <label>Votre question (20 caractères maximum) :</label>
            <textarea id="texteQuestion" maxlength="20" required></textarea>

            <button type="submit">Envoyer à l'Admin</button>
        </form>

        <p id="messageQuestion"></p>
    </div>
</section>
    <h2>Connexion</h2>

    <form id="loginForm">
        <label>Email :</label><br>
        <input type="email" id="email" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" id="password" required><br><br>

        <button type="submit">Se connecter</button>
    </form>

    <form id="identificationForm" style="display:none;">
        <h2>Identification utilisateur</h2>

        <label>Code utilisateur :</label><br>
        <input type="text" id="codeUtilisateur" required><br><br>

        <label>Nom complet :</label><br>
        <input type="text" id="nomComplet" required><br><br>

        <button type="submit">Valider</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
